name: Collect BTC market data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect.yml'
      - 'scripts/probe_coinbase.py'
      - 'scripts/probe_binance_futures.py'
permissions:
  contents: write
concurrency:
  group: btc-hourly-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test calculations and failure handling
        run: |
          python -m unittest discover -s tests -p 'test_core.py' -v
          python -m unittest discover -s tests -p 'test_btc_http.py' -v
          python -m unittest discover -s tests -p 'test_integration.py' -v
          python -m unittest discover -s tests -p 'test_options.py' -v
      - name: Verify Coinbase endpoints in runner
        run: python scripts/probe_coinbase.py
      - name: Verify official Binance Futures sources in runner
        run: python scripts/probe_binance_futures.py
      - name: Collect current data
        run: python -u -m btc_collector.main
      - name: Validate output
        run: python scripts/check_output.py
      - name: Commit and push data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json options_chain.json history.csv state/coinbase.json docs/latest-endpoint-check.json docs/coinbase-runner-check.json docs/binance-futures-runner-check.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update BTC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Preserve small diagnostic files on infrastructure failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: btc-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            latest.json
            docs/latest-endpoint-check.json
            docs/coinbase-runner-check.json
            docs/binance-futures-runner-check.json
          retention-days: 1
          if-no-files-found: warn
