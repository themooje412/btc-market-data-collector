name: BTC ETH SOL ZEC execution watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-asset-execution-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run focused execution-watcher tests
        run: |
          python -m unittest discover -s tests -p 'test_execution_watcher.py' -v
          python -m unittest discover -s tests -p 'test_multi_asset_execution.py' -v
          python -m unittest discover -s tests -p 'test_swing_execution.py' -v

      - name: Collect swing-aware execution state for four assets
        run: |
          python -u -m btc_collector.swing_execution --asset BTC
          python -u -m btc_collector.swing_execution --asset ETH
          python -u -m btc_collector.swing_execution --asset SOL
          python -u -m btc_collector.swing_execution --asset ZEC

      - name: Commit latest execution state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            execution_plan.json execution_snapshot.json execution_state.json execution_history.csv \
            assets/eth/execution_plan.json assets/eth/execution_snapshot.json assets/eth/execution_state.json assets/eth/execution_history.csv \
            assets/sol/execution_plan.json assets/sol/execution_snapshot.json assets/sol/execution_state.json assets/sol/execution_history.csv \
            assets/zec/execution_plan.json assets/zec/execution_snapshot.json assets/zec/execution_state.json assets/zec/execution_history.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update multi-asset swing execution state $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
