name: BTC execution watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-execution-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run focused execution-watcher tests
        run: python -m unittest tests.test_execution_watcher -v

      - name: Collect fast execution state
        run: python -u -m btc_collector.execution_watcher

      - name: Commit latest execution state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution_plan.json execution_snapshot.json execution_state.json execution_history.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update BTC execution state $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
