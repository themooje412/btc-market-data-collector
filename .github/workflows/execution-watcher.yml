name: BTC ETH SOL ZEC execution watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-asset-execution-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run focused execution-watcher tests
        run: |
          python -m unittest discover -s tests -p 'test_execution_watcher.py' -v
          python -m unittest discover -s tests -p 'test_multi_asset_execution.py' -v
          python -m unittest discover -s tests -p 'test_swing_execution.py' -v
          python -m unittest discover -s tests -p 'test_pnl_tracker.py' -v
          python -m unittest discover -s tests -p 'test_bybit_demo_executor.py' -v

      - name: Run five one-minute swing cycles
        env:
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
          BYBIT_DEMO_ACCOUNT_R_PCT: '0.01'
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5; do
            cycle_start=$(date +%s)
            echo "=== swing cycle $iteration/5 ==="

            python -u -m btc_collector.swing_execution --asset BTC
            python -u -m btc_collector.swing_execution --asset ETH
            python -u -m btc_collector.swing_execution --asset SOL
            python -u -m btc_collector.swing_execution --asset ZEC

            if [[ -n "${BYBIT_DEMO_API_KEY:-}" && -n "${BYBIT_DEMO_API_SECRET:-}" ]]; then
              python -u -m btc_collector.bybit_demo_executor --execute
            else
              echo "Bybit demo secrets are not configured; execution skipped."
            fi

            if [[ "$iteration" -lt 5 ]]; then
              elapsed=$(( $(date +%s) - cycle_start ))
              remaining=$(( 60 - elapsed ))
              if [[ "$remaining" -gt 0 ]]; then
                sleep "$remaining"
              fi
            fi
          done

      - name: Rebuild historical PnL reports
        run: python -u -m btc_collector.pnl_tracker

      - name: Commit latest execution state, demo ledger and PnL
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            execution_plan.json execution_snapshot.json execution_state.json execution_history.csv \
            assets/eth/execution_plan.json assets/eth/execution_snapshot.json assets/eth/execution_state.json assets/eth/execution_history.csv \
            assets/sol/execution_plan.json assets/sol/execution_snapshot.json assets/sol/execution_state.json assets/sol/execution_history.csv \
            assets/zec/execution_plan.json assets/zec/execution_snapshot.json assets/zec/execution_state.json assets/zec/execution_history.csv \
            performance/trades.csv performance/summary.json
          [[ -f bybit_demo_state.json ]] && git add bybit_demo_state.json
          [[ -f bybit_demo_history.csv ]] && git add bybit_demo_history.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update swing execution, Bybit demo and PnL $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1
